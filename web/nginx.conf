server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── CSPM (Node/Express) ───────────────────────────────────────────────────
    # Frontend calls /api/cspm/*  → backend's own /api/* (prefix rewritten away).
    location /api/cspm/ {
        proxy_pass http://cspm-api:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400;
    }

    # Socket.IO (CSPM real-time scan progress / threats / config changes)
    location /socket.io/ {
        proxy_pass http://cspm-api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 86400;
    }

    # ── ASPM (Python/FastAPI) ─────────────────────────────────────────────────
    # Frontend calls /api/aspm/*  → backend's own /api/* (prefix rewritten away).
    # proxy_buffering off is REQUIRED for the SSE scan/pentest log streams.
    location /api/aspm/ {
        proxy_pass http://aspm-api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 86400;
    }

    # ── Unified SPA (CSPM React app with ASPM folded in) ──────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
