server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve upstream container names at request time (Docker embedded DNS).
    # Prevents stale-IP 502s when a backend container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── CSPM (Node/Express) ───────────────────────────────────────────────────
    location /api/cspm/ {
        set $cspm_upstream cspm-api;
        rewrite ^/api/cspm/(.*)$ /api/$1 break;
        proxy_pass http://$cspm_upstream:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400;
    }

    # Socket.IO (CSPM real-time)
    location /socket.io/ {
        set $cspm_ws cspm-api;
        proxy_pass http://$cspm_ws:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 86400;
    }

    # ── ASPM (Python/FastAPI) ─────────────────────────────────────────────────
    location /api/aspm/ {
        set $aspm_upstream aspm-api;
        rewrite ^/api/aspm/(.*)$ /api/$1 break;
        proxy_pass http://$aspm_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 86400;
    }

    # ── Unified SPA ───────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
