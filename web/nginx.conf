# aspm-api and agent-api (both Python/FastAPI) have no application-level rate
# limiting of their own — unlike cspm-api, which already self-limits via
# express-rate-limit. Both are reachable externally through this proxy even
# though neither has a docker-compose `ports:` mapping, so the gap is real.
# Limiting here at the edge covers all three upstreams in one place without
# touching the Python scanner services. 15r/s with a 30-request burst comfortably
# covers normal dashboard polling while still blocking abusive/DoS-style bursts.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=15r/s;
# nginx defaults rate-limit rejections to 503; use 429 to match cspm-api's
# own express-rate-limit responses and the standard "too many requests" code.
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── CSPM (Node/Express) ───────────────────────────────────────────────────
    location /api/cspm/ {
        set $cspm_upstream cspm-api;
        rewrite ^/api/cspm/(.*)$ /api/$1 break;
        proxy_pass http://$cspm_upstream:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400;
    }

    # Socket.IO (CSPM real-time)
    location /socket.io/ {
        set $cspm_ws cspm-api;
        proxy_pass http://$cspm_ws:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 86400;
    }

    # ── ASPM Swagger/OpenAPI docs ─────────────────────────────────────────────
    location = /api/aspm/docs {
        set $aspm_docs aspm-api;
        proxy_pass http://$aspm_docs:8000;
        proxy_set_header Host $host;
    }
    location = /api/aspm/redoc {
        set $aspm_redoc aspm-api;
        proxy_pass http://$aspm_redoc:8000;
        proxy_set_header Host $host;
    }
    location = /api/aspm/openapi.json {
        set $aspm_openapi aspm-api;
        proxy_pass http://$aspm_openapi:8000;
        proxy_set_header Host $host;
    }

    # ── ASPM (Python/FastAPI) ─────────────────────────────────────────────────
    location /api/aspm/ {
        limit_req zone=api_general burst=30 nodelay;
        set $aspm_upstream aspm-api;
        rewrite ^/api/aspm/(.*)$ /api/$1 break;
        proxy_pass http://$aspm_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 86400;
    }

    # ── Agent API Swagger/OpenAPI docs ────────────────────────────────────────
    location = /api/agent/docs {
        set $agent_docs agent-api;
        proxy_pass http://$agent_docs:8100;
        proxy_set_header Host $host;
    }
    location = /api/agent/redoc {
        set $agent_redoc agent-api;
        proxy_pass http://$agent_redoc:8100;
        proxy_set_header Host $host;
    }
    location = /api/agent/openapi.json {
        set $agent_openapi agent-api;
        proxy_pass http://$agent_openapi:8100;
        proxy_set_header Host $host;
    }

    # ── Agent API (Python/FastAPI/LangGraph) ──────────────────────────────────
    location /api/agent/ {
        limit_req zone=api_general burst=30 nodelay;
        set $agent_upstream agent-api;
        rewrite ^/api/agent/(.*)$ /$1 break;
        proxy_pass http://$agent_upstream:8100;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 86400;
    }

    # ── Unified SPA ───────────────────────────────────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
